services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: satellites_server
    restart: unless-stopped
    ports:
      # WS/TCP is fronted by host Caddy (localhost only, shifted off 8080).
      - "127.0.0.1:18080:8080/tcp"
      # OSC from SuperCollider comes in directly over UDP (not via Caddy).
      - "8081:8081/udp"
    volumes:
      - ./recordings:/recordings

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SOCKET_PORT: 8080
        VITE_STATIC_PORT: 8083
        VITE_SERVER_URL: satellites.christian-grothe.com
        VITE_WEBSOCKET_PROTOCOL: wss
        VITE_HTTP_PROTOCOL: https
    container_name: satellites_frontend
    restart: unless-stopped
    ports:
      # Fronted by host Caddy on 443 (localhost only).
      - "127.0.0.1:5173:80"

  static:
    image: nginx
    container_name: satellites_static
    restart: unless-stopped
    ports:
      # Fronted by host Caddy on 8083 (localhost only, shifted off 8083).
      - "127.0.0.1:18083:80"
    volumes:
      - ./recordings:/usr/share/nginx/html/recordings:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
