services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: satellites_server
    ports:
      - "8080:8080/tcp"
      - "8081:8081/udp"
    volumes:
      - ./recordings:/app/recordings
      - ./server:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: satellites_frontend
    environment:
      #VITE_SERVER_URL: localhost:8080
      VITE_SOCKET_PORT: 8080
      VITE_STATIC_PORT: 8083
      VITE_SERVER_URL: 192.168.1.183
      VITE_WEBSOCKET_PROTOCOL: ws
      VITE_HTTP_PROTOCOL: http 
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  static:
    image: nginx
    container_name: satellites_static
    ports:
      - "8083:80"
    volumes:
      - ./recordings:/usr/share/nginx/html/recordings:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

